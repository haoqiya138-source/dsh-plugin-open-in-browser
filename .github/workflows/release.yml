name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and test only, do not publish'
        required: false
        default: 'false'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm and create the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Ensure npm supports trusted publishing
        run: |
          if [ "$(npm --version | cut -d. -f1)" -lt 11 ]; then
            npm install -g npm@latest
          fi
          npm --version

      - name: Install dev dependencies
        run: npm ci

      - name: Typecheck and test (rebuilds dist/)
        run: npm run typecheck && npm test

      # Trusted publishing: the runner's OIDC token authenticates the publish,
      # so no npm token secret is stored in this repository.
      # https://docs.npmjs.com/trusted-publishers
      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == 'false' }}
        run: npm publish --access public --provenance

      - name: Create GitHub release
        if: ${{ github.event_name == 'push' }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
