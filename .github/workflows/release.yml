name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and test only, do not publish'
        required: false
        default: 'false'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm and create the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dev dependencies
        run: npm ci

      - name: Typecheck and test (rebuilds dist/)
        run: npm run typecheck && npm test

      # A tag can be pushed before the NPM_TOKEN secret exists (for example while
      # bootstrapping the repository). In that case the npm publish step is
      # skipped and the GitHub release is still created, so the workflow stays
      # green instead of failing on a missing token.
      - name: Check for an npm token
        id: npm-token
        run: echo "present=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: ${{ steps.npm-token.outputs.present == 'true' && (github.event_name == 'push' || inputs.dry_run == 'false') }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip npm publish (no NPM_TOKEN secret)
        if: ${{ steps.npm-token.outputs.present != 'true' }}
        run: echo "::notice::NPM_TOKEN is not configured; skipping npm publish. Add the secret to enable CI releases."

      - name: Create GitHub release
        if: ${{ github.event_name == 'push' }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
